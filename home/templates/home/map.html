{% extends 'base.html' %}
{% block content %}
<link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>

<div class="container py-3">
  <h2 class="mb-3">MovieMap!</h2>
  <div id="map" style="width:100%; height:600px;"></div>
</div>

{{ cities|json_script:"cities-data" }}

<script>
  mapboxgl.accessToken = "pk.eyJ1Ijoic2lyZ29uc2FsMTEiLCJhIjoiY211enBvcXFrMGRsNjJ5cHBpZ211NGZ6aCJ9.cmGkp9W8LtNd2R2FreNgYA";

  const cities = JSON.parse(document.getElementById("cities-data").textContent);
  const userCity = "{{ user_city }}";

  const map = new mapboxgl.Map({
    container: "map",
    style: "mapbox://styles/mapbox/streets-v12",
    center: [{{ lng }}, {{ lat }}],
    zoom: 4
  });

  cities.forEach(c => {
    let html = `<strong>${c.city}</strong><br>${c.movie}: ${c.total} purchases`;
    if (c.you_bought !== null) {
      html += `<br><b>You bought ${c.you_bought} cop${c.you_bought === 1 ? "y" : "ies"}</b>`;
    }
    new mapboxgl.Marker({ color: c.city === userCity ? "#007bff" : "#dc3545" })
      .setLngLat([c.lng, c.lat])
      .setPopup(new mapboxgl.Popup().setHTML(html))
      .addTo(map);
  });
</script>
{% endblock content %}
