{% extends 'base.html' %}
{% block content %}
<header class="masthead bg-index text-white text-center py-4">
  <div class="container d-flex align-items-center flex-column pt-2">
    <h2>Movies Store</h2>
    <p>Your Ticket to Unlimited Entertainment!</p>
  </div>
</header>
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col mx-auto text-center mb-3">
        <h4>Welcome to the best movie store!!</h4>
      </div>
    </div>
  </div>
</div>
{% if user.is_authenticated %}
  {% if profile.location_chosen %}
    <a href="{% url 'home.map' %}" class="btn btn-primary">View Trending Map</a>
  {% else %}
    <form method="post" action="" class="d-flex gap-2">
      {% csrf_token %}
      <select name="location" class="form-control w-auto">
        {% for value, label in location_choices %}
          <option value="{{ value }}" {% if value == 'Atlanta' %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
      <button class="btn btn-primary"
              onclick="return confirm('You can only choose once. Continue?')">
        Confirm location (one time)
      </button>
    </form>
  {% endif %}
{% endif %}
{% endblock content %}
