{% extends "admin/base_site.html" %}

{% block content %}
<h1>Purchase Ranking</h1>

<form method="get">
    <label for="limit">Number of top users want to check:</label>
    <input type="number" id="limit" name="limit" min="1" value="{{ limit }}">
    <button type="submit">Apply</button>
</form>

<table>
    <thead>
        <tr>
            <th>Rank</th>
            <th>Username</th>
            <th>Purchases</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ user.username }} </td>
            <td>{{ user.total_purchased}} </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No users found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
